name: nona_client
description: "Виртуальный Помощник Нона: кроссплатформенный VPN-клиент."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  ffi: ^2.1.4
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  oidc: ^5.0.2
  oidc_default_store: ^2.0.0
  shared_preferences: ^2.5.6
  desktop_webview_window: ^0.4.2
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/nona-portrait.png
    - assets/brand/nona-full-body.png
    - assets/routing/desktop_sites.json
